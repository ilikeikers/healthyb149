<!DOCTYPE html>

<html lang="en">
    <head>
        <meta name="viewport" content="initial-scale=1, width=device-width">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="/static/styles.css">
        <title>B149 Weight Loss Challenge</title>
    </head>
    <body>
        <header>
            <div class="topnav" id="myTopnav">
                <a href="{{ url_for('index') }}" class="active">Healthy B149</a>
                <div id="extraLinks">
                    <a href="{{ url_for('join') }}">Sign Up</a>
                    <a href="{{ url_for('weighIn') }}">Weigh In</a>
                    <a href="{{ url_for('getStats') }}">Get Stats</a>
                    <a href="{{ url_for('leaderboard') }}">Leaderboard</a>
                </div>
                <a href="javascript:void(0);" class="icon" onclick="myFunction()">
                    <i class="fa fa-bars"></i>
                </a>
            </div>
        </header>
        {% block body %}{% endblock %}
    </body>

<script>
    /* Toggle between adding and removing the "responsive" class to topnav when the user clicks on the icon */
    function myFunction() {
        var x = document.getElementById("extraLinks");
        if (x.style.display === "block") {
            x.style.display = "none";
        } else {
            x.style.display = "block";
        }
    }
</script>

</html>
